<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Nightdrive</title>
  <style>
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
    body { height: 100dvh; }
    body { display: flex; align-items: center; justify-content: center; font: 12px/1.4 ui-monospace, Menlo, Consolas, monospace; color: #f0d8ff; }
    #screen { display: block; image-rendering: pixelated; image-rendering: crisp-edges; }
    body.idle, body.idle #screen { cursor: none; }
    #loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; letter-spacing: .3em; color: #ff5fd0; text-shadow: 0 0 8px #ff3cc8; }
    body.ready #loading { display: none; }
    #hud { position: fixed; left: 16px; bottom: 14px; padding: 6px 10px; background: rgba(10, 4, 24, .55); border: 1px solid rgba(255, 90, 210, .35); border-radius: 4px; transition: opacity .6s; pointer-events: none; }
    body.idle #hud, body.nohud #hud { opacity: 0; }
    #hud b { color: #6ae0ff; font-weight: normal; }
    #toast { position: fixed; left: 50%; top: 18px; transform: translateX(-50%); padding: 4px 12px; letter-spacing: .25em; text-transform: uppercase; color: #ffd6f6; background: rgba(10, 4, 24, .6); border: 1px solid rgba(255, 90, 210, .4); border-radius: 3px; opacity: 0; transition: opacity .5s; pointer-events: none; }
    #toast.show { opacity: 1; }
    #soundhint { position: fixed; left: 50%; bottom: 56px; transform: translateX(-50%); padding: 6px 14px; letter-spacing: .3em; color: #6ae0ff; background: rgba(10, 4, 24, .6); border: 1px solid rgba(106, 224, 255, .45); border-radius: 3px; display: none; pointer-events: none; animation: pulse 2.4s ease-in-out infinite; }
    #soundhint.show { display: block; }
    @keyframes pulse { 50% { opacity: .45; } }
    @media (prefers-reduced-motion: reduce) { #soundhint { animation: none; } }
    #rec { position: fixed; right: 16px; top: 12px; padding: 3px 9px; color: #fff; background: rgba(200, 20, 40, .85); border-radius: 3px; letter-spacing: .15em; display: none; }
    #rec.show { display: block; }
    #stats { position: fixed; right: 12px; top: 10px; color: #9fffd0; background: rgba(0,0,0,.5); padding: 3px 7px; display: none; }
    #stats.show { display: block; }
    /* touch controls (phones, tablets) */
    #touch { display: none; }
    body.touch { touch-action: none; -webkit-user-select: none; user-select: none; }
    body.touch #touch { display: block; }
    body.touch #hud { display: none; }
    body.touch #rec { right: auto; left: max(12px, env(safe-area-inset-left)); }
    #touch button { font: inherit; color: #ffd6f6; background: rgba(10, 4, 24, .55); border: 1px solid rgba(255, 90, 210, .45); border-radius: 10px; touch-action: none; -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; }
    #pedals { position: fixed; right: max(16px, env(safe-area-inset-right)); bottom: max(16px, env(safe-area-inset-bottom)); display: flex; gap: 14px; transition: opacity .6s; }
    #pedals button { width: 66px; height: 66px; border-radius: 50%; display: grid; place-items: center; color: #6ae0ff; border-color: rgba(106, 224, 255, .5); }
    #pedals button svg { width: 26px; height: 26px; fill: currentColor; pointer-events: none; }
    #pedals button.on { background: rgba(255, 60, 200, .4); color: #fff; box-shadow: 0 0 16px #ff3cc8; }
    #menuBtn { position: fixed; top: max(12px, env(safe-area-inset-top)); right: max(12px, env(safe-area-inset-right)); width: 44px; height: 44px; display: grid; place-items: center; transition: opacity .6s; }
    #menuBtn svg { width: 20px; height: 20px; fill: currentColor; pointer-events: none; }
    #menu { position: fixed; top: calc(max(12px, env(safe-area-inset-top)) + 52px); right: max(12px, env(safe-area-inset-right)); display: none; grid-template-columns: 1fr 1fr; gap: 6px; }
    #menu.open { display: grid; }
    #menu button { padding: 10px 12px; min-width: 104px; font-size: 11px; letter-spacing: .15em; text-transform: uppercase; }
    body.touch.idle #pedals, body.touch.idle #menuBtn { opacity: .3; }
    body.touch.nohud #pedals { opacity: 0; pointer-events: none; }
    #rotate { display: none; position: fixed; left: 0; right: 0; bottom: 120px; text-align: center; letter-spacing: .25em; color: #6ae0ff; }
    body.touch.portrait #rotate { display: block; }
    body.touch.portrait #soundhint { bottom: auto; top: calc(50% + 28vw + 18px); }
    /* the car stereo, in the corner of the picture */
    #radio { position: fixed; z-index: 2; image-rendering: pixelated; image-rendering: crisp-edges; cursor: pointer; transition: opacity .6s; touch-action: none; display: none; }
    body.ready #radio { display: block; }
    body.idle #radio { opacity: .35; }
    body.nohud #radio, body.intro #radio { display: none; }
    /* the opening scene draws its own prompt in the picture */
    body.intro #hud, body.intro #soundhint, body.intro #pedals { display: none; }
  </style>
</head>
<body>
  <canvas id="screen" width="640" height="360"></canvas>
  <div id="loading">BUILDING THE CITY…</div>
  <div id="hud"><b>↑↓</b> speed · <b>F</b> fullscreen · <b>M</b> music · <b>←→</b> radio · <b>N</b> next track · <b>R</b> record · <b>W</b> weather · <b>L</b> letterbox · <b>T</b> titles · <b>V</b> driver talk · <b>H</b> hide hints · <b>Space</b> pause</div>
  <div id="soundhint">CLICK OR PRESS ANY KEY FOR SOUND</div>
  <div id="rec">REC 0:00:00</div>
  <div id="toast"></div>
  <div id="stats"></div>
  <div id="touch">
    <div id="pedals">
      <button id="brake" aria-label="Brake"><svg viewBox="0 0 24 24"><path d="M3 7h18L12 19z"/></svg></button>
      <button id="gas" aria-label="Accelerate"><svg viewBox="0 0 24 24"><path d="M3 17h18L12 5z"/></svg></button>
    </div>
    <button id="menuBtn" aria-label="Controls"><svg viewBox="0 0 24 24"><path d="M3 5h18v2.5H3zM3 10.75h18v2.5H3zM3 16.5h18V19H3z"/></svg></button>
    <div id="menu">
      <button data-act="music">Music</button>
      <button data-act="next">Next track</button>
      <button data-act="weather">Weather</button>
      <button data-act="driver">Driver talk</button>
      <button data-act="titles">Titles</button>
      <button data-act="letterbox">Letterbox</button>
      <button data-act="pause">Pause</button>
      <button data-act="hints">Hide pedals</button>
      <button data-act="fullscreen">Fullscreen</button>
      <button data-act="record">Record</button>
    </div>
    <div id="rotate">TURN YOUR PHONE SIDEWAYS ↻</div>
  </div>

  <script src="src/core.js"></script>
  <script src="src/font.js"></script>
  <script src="src/art/sky.js"></script>
  <script src="src/art/skyline.js"></script>
  <script src="src/art/buildings.js"></script>
  <script src="src/art/bigsign.js"></script>
  <script src="src/art/palms.js"></script>
  <script src="src/art/people.js"></script>
  <script src="src/art/cars.js"></script>
  <script src="src/art/vehicles.js"></script>
  <script src="src/art/dude.js"></script>
  <script src="src/art/props.js"></script>
  <script src="src/weather.js"></script>
  <script src="src/fx.js"></script>
  <script src="assets/vocals/pack.js"></script>
  <script src="src/audio.js"></script>
  <script src="src/band.js"></script>
  <script src="src/recorder.js"></script>
  <script src="src/radio.js"></script>
  <script src="src/intro.js"></script>
  <script src="src/world.js"></script>
  <script src="src/renderer.js"></script>
  <script src="src/main.js"></script>
</body>
</html>
